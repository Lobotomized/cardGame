<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --card-background: #1e1e1e;
            --active-stat-color: #333333;
            --letters-color: #f0f0f0;
            --background: #121212;
            --frame-color: #0a0a0a;
            --accent-color: #c9a227;
            --umnojitel: 4;
            --card-height: 320px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            padding: 20px;
            margin: 0;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: #c9a227;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #1e1e1e;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 {
            margin-top: 0;
            color: #aaa;
        }
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #f0f0f0;
        }
        .chart-container {
            background-color: #1e1e1e;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 30px;
            height: 400px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
            color: #c9a227;
        }

        /* Round List */
        .round-item {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .round-item:hover {
            background-color: #2a2a2a;
        }
        .round-item-info {
            font-size: 0.95rem;
            color: #ccc;
        }
        .round-item-score {
            font-weight: bold;
            color: #f0f0f0;
            font-size: 1.1rem;
        }

        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            overflow-y: auto;
        }
        
        .modal-content {
            margin: auto;
            flex-shrink: 0;
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 2px;
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid #333333;
            background: #121212;
        }

        .modal-header h2 { margin: 0; color: #f0f0f0; text-transform: uppercase; letter-spacing: 2px; }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #cccccc;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn:hover { color: #ffffff; }

        .history-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .trick-row {
            background: #121212;
            border: 1px solid #333333;
            border-radius: 2px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trick-number {
            font-weight: 600;
            color: #cccccc;
            text-transform: uppercase;
            border-bottom: 1px solid #333333;
            padding-bottom: 5px;
            font-family: 'Playfair Display', serif;
        }

        .trick-cards {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .label {
            font-weight: 600;
            color: #cccccc;
            text-transform: uppercase;
        }

        .card-layout-box {
            width: calc(45px * var(--umnojitel) * 0.6);
            height: calc(var(--card-height) * 0.6);
            position: relative;
        }

        .card-scaler {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: calc(45px * var(--umnojitel));
            height: auto;
            min-height: var(--card-height);
            border-radius: 2px;
            display: flex;
        }

        .vs-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .vs { font-size: 1.5rem; color: #888; font-family: 'Playfair Display', serif; }

        .winner-badge {
            padding: 5px 10px;
            border-radius: 2px;
            font-size: 0.9rem;
            background: #1a1a1a;
            color: #f0f0f0;
            border: 1px solid #333333;
        }
        .winner-badge.win { background: #f0f0f0; color: #121212; border-color: #f0f0f0; }
        .winner-badge.loss { background: #444444; color: #f0f0f0; border-color: #444444; }

        /* Card Styles */
        .card {
            color: var(--letters-color);
            display: flex;
            flex-direction: column;
            width: 100%;
            height: var(--card-height);
            background: var(--card-background);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #333333;
            border-radius: 2px;
            padding: 10px;
            box-sizing: border-box;
        }
        .card-image {
            width: 100%;
            background: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 6px solid var(--frame-color);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.5);
            margin-bottom: 12px;
            height: calc(var(--card-height) * 0.400);
            overflow: hidden;
        }
        .card-image img, .card-image video { width: 100%; height: 100%; object-fit: cover; }
        .description {
            background: #0f0f0f;
            border: 1px solid #333333;
            padding: 8px;
            margin-bottom: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }
        .description::-webkit-scrollbar { width: 4px; }
        .description::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        .card-name-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: bold; color: var(--letters-color); text-align: center; margin-bottom: 4px; }
        .skill-name-title { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-style: italic; color: #b0b0b0; border-bottom: 1px solid #333333; padding-bottom: 4px; margin-bottom: 4px; }
        .skill-desc-text { font-size: 0.8rem; line-height: 1.3; color: #a0a0a0; }
        .card-stats { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #333333; padding-top: 8px; }
        .stat { display: flex; flex-direction: column; align-items: center; border: 1px solid #444444; padding: 4px 0; flex: 1; background: #1a1a1a; }
        .stat h4 { margin: 0; font-size: 0.75rem; color: #aaaaaa; text-transform: uppercase; font-weight: 600; }
        .stat p { margin: 2px 0 0 0; font-weight: 400; font-size: 1.2rem; color: #f0f0f0; font-family: 'Georgia', serif; }
        .activeStat { background: #333; border-color: var(--accent-color); box-shadow: inset 0 0 0 1px var(--accent-color); }
        .activeStat h4 { color: var(--accent-color); }
        .activeStat p { color: #ffffff; font-weight: 700; }

        @media (max-width: 600px) {
            .trick-cards { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Game Analytics Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Unique IPs (Played)</h3>
                <div class="value" id="unique-ips">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Games Played</h3>
                <div class="value" id="total-games">-</div>
            </div>
            <div class="stat-card">
                <h3>PvP Games</h3>
                <div class="value" id="pvp-games">-</div>
            </div>
            <div class="stat-card">
                <h3>Tutorial Opens</h3>
                <div class="value" id="tutorial-opens">-</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="dailyGamesChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="dailyIpsChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="siteVisitsChart"></canvas>
        </div>

        <h2>Recent Rounds History</h2>
        <div id="rounds-container">
            <p>Loading...</p>
        </div>

        <h2>IP Stats</h2>
        <table>
            <thead>
                <tr>
                    <th>IP Address</th>
                    <th>Total Games</th>
                    <th>PvP Games</th>
                </tr>
            </thead>
            <tbody id="ip-stats-body">
                <tr><td colspan="3">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal for History -->
    <div id="history-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Battle History</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="history-list" id="modal-history-list">
                <!-- Tricks will go here -->
            </div>
        </div>
    </div>

    <script>
        let analyticsData = null;

        async function fetchAnalytics() {
            try {
                const response = await fetch('/api/analytics');
                analyticsData = await response.json();
                renderDashboard(analyticsData);
            } catch (error) {
                console.error("Error fetching analytics:", error);
            }
        }

        function renderDashboard(data) {
            // Update Top Stats
            document.getElementById('unique-ips').textContent = data.uniqueIpsCount || 0;
            const totalGames = data.allGames ? data.allGames.length : 0;
            document.getElementById('total-games').textContent = totalGames;
            const pvpGames = data.pvpGames ? data.pvpGames.length : 0;
            document.getElementById('pvp-games').textContent = pvpGames;
            let tutOpens = 0;
            if(data.tutorialOpens) { tutOpens = data.tutorialOpens.reduce((acc, curr) => acc + curr.count, 0); }
            document.getElementById('tutorial-opens').textContent = tutOpens;

            // Render Charts (omitted logic remains the same)
            renderCharts(data);

            // Render IP Stats
            const ipStatsBody = document.getElementById('ip-stats-body');
            ipStatsBody.innerHTML = '';
            if(data.ipStats && data.ipStats.length > 0) {
                data.ipStats.forEach(stat => {
                    ipStatsBody.innerHTML += `<tr><td>${stat.ip}</td><td>${stat.totalGames}</td><td>${stat.pvpGames}</td></tr>`;
                });
            } else {
                ipStatsBody.innerHTML = '<tr><td colspan="3">No data available</td></tr>';
            }

            // Render Recent Rounds List
            const roundsContainer = document.getElementById('rounds-container');
            roundsContainer.innerHTML = '';
            if(data.roundHistory && data.roundHistory.length > 0) {
                data.roundHistory.forEach((round, index) => {
                    const div = document.createElement('div');
                    div.className = 'round-item';
                    div.onclick = () => openModal(index);
                    
                    const time = new Date(round.timestamp).toLocaleString();
                    const pvpTxt = round.isPvp ? 'PvP' : 'vs Bot';
                    const modeTxt = round.mode || 'N/A';
                    
                    div.innerHTML = `
                        <div>
                            <div style="font-weight:bold; margin-bottom:5px; color:#c9a227">Round ${index + 1} - ${time}</div>
                            <div class="round-item-info">Mode: ${modeTxt} | ${pvpTxt} | IPs: ${round.ips ? round.ips.join(', ') : 'N/A'}</div>
                        </div>
                        <div class="round-item-score">
                            P1: ${round.player1Score} - P2: ${round.player2Score}
                        </div>
                    `;
                    roundsContainer.appendChild(div);
                });
            } else {
                roundsContainer.innerHTML = '<p>No rounds recorded yet.</p>';
            }
        }

        function renderCharts(data) {
            // Daily Games
            new Chart(document.getElementById('dailyGamesChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: data.dailyGamesData.map(d => d.date),
                    datasets: [
                        { label: 'Total Games', data: data.dailyGamesData.map(d => d.total), backgroundColor: '#c9a227' },
                        { label: 'PvP Games', data: data.dailyGamesData.map(d => d.pvp), backgroundColor: '#f0f0f0' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'Games Played per Day', color: '#fff' }, legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#aaa' } }, y: { ticks: { color: '#aaa', stepSize: 1 }, beginAtZero: true } } }
            });
            // Daily IPs
            new Chart(document.getElementById('dailyIpsChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: data.dailyUniquePlayers.map(d => d._id),
                    datasets: [{ label: 'Unique IPs Played', data: data.dailyUniquePlayers.map(d => d.uniquePlayers), borderColor: '#00bcd4', backgroundColor: 'rgba(0, 188, 212, 0.2)', fill: true, tension: 0.1 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'Unique IPs Playing per Day', color: '#fff' }, legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#aaa' } }, y: { ticks: { color: '#aaa', stepSize: 1 }, beginAtZero: true } } }
            });
            // Site Visits
            new Chart(document.getElementById('siteVisitsChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: data.siteVisitsData.map(d => d._id),
                    datasets: [
                        { label: 'Total Visits', data: data.siteVisitsData.map(d => d.totalVisits), backgroundColor: '#4caf50' },
                        { label: 'Unique IPs Visited', data: data.siteVisitsData.map(d => d.uniqueIps), backgroundColor: '#8bc34a' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'Website Visits per Day', color: '#fff' }, legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#aaa' } }, y: { ticks: { color: '#aaa', stepSize: 1 }, beginAtZero: true } } }
            });
        }

        function buildCardHtml(card, mode) {
            if (!card) return '<div class="card" style="justify-content:center;align-items:center;background:#0f0f0f">None</div>';
            
            let imageHtml = '';
            // If animation property is missing (from older rounds in DB), fallback to a normalized title
            let animName = card.animation;
            if (!animName && card.title) {
                animName = card.title.toLowerCase().replace(/\s+/g, '');
                if (animName === 'swissarmyknife') animName = 'swissArmyKnife';
                if (animName === 'forestdragon') animName = 'forestDragon';
                if (animName === 'windelemental') animName = 'windElemental';
                if (animName === 'copycat') animName = 'copyCat';
                if (animName === 'oldwitcher' || animName === 'witcher') animName = 'oldMen';
            }

            if (animName) {
                // We use the express /raw-assets/ route to hit fe/src/assets/ directly without hashes.
                // It falls back from mp4 -> jpg -> webp automatically using the onerror handler.
                imageHtml = `<video src="/raw-assets/${animName}.mp4" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;" onerror="this.outerHTML='<img src=\\'/raw-assets/${animName}.jpg\\' alt=\\'${card.title}\\' style=\\'width:100%; height:100%; object-fit:cover;\\' onerror=\\'this.src=\\&quot;/raw-assets/${animName}.webp\\&quot;\\'>'"></video>`;
            } else {
                imageHtml = `<div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; color:#555;">No Image</div>`;
            }

            // Also fallback for missing descriptionTitle and description for older games
            let descTitle = card.descriptionTitle || card.special || 'No special';
            let desc = card.description || '';

            // We apply exactly the same structure as the Svelte Card.svelte component
            return `
            <div class="card">
                <div class="card-image">
                    ${imageHtml}
                </div>
                <div class="description">
                    <div class="card-name-title">${card.title}</div>
                    <div class="skill-name-title">${descTitle}</div>
                    <div class="skill-desc-text">${desc}</div>
                </div>
                <div class="card-stats">
                    <div class="stat ${mode === 'agility' ? 'activeStat' : ''}"><h4>Agi</h4><p>${card.agi}</p></div>
                    <div class="stat ${mode === 'intelligence' ? 'activeStat' : ''}"><h4>Int</h4><p>${card.int}</p></div>
                    <div class="stat ${mode === 'strength' ? 'activeStat' : ''}"><h4>Str</h4><p>${card.str}</p></div>
                </div>
            </div>
            `;
        }

        function openModal(index) {
            if (!analyticsData || !analyticsData.roundHistory) return;
            const round = analyticsData.roundHistory[index];
            const list = document.getElementById('modal-history-list');
            list.innerHTML = '';
            
            if (round.history && round.history.length > 0) {
                round.history.forEach((trick, tIdx) => {
                    const winnerText = trick.winnerRef === 'tie' ? 'TIE' : (trick.winnerRef === 'player1' ? 'P1 WON' : 'P2 WON');
                    const badgeClass = trick.winnerRef === 'tie' ? '' : (trick.winnerRef === 'player1' ? 'win' : 'loss');

                    const html = `
                    <div class="trick-row">
                        <div class="trick-number">Trick ${tIdx + 1}</div>
                        <div class="trick-cards">
                            <div class="card-wrapper">
                                <div class="label">Player 1</div>
                                <div class="card-layout-box">
                                    <div class="card-scaler">
                                        ${buildCardHtml(trick.player1Card, round.mode)}
                                    </div>
                                </div>
                            </div>
                            <div class="vs-label">
                                <span class="winner-badge ${badgeClass}">${winnerText}</span>
                                <span class="vs">VS</span>
                            </div>
                            <div class="card-wrapper">
                                <div class="label">Player 2</div>
                                <div class="card-layout-box">
                                    <div class="card-scaler">
                                        ${buildCardHtml(trick.player2Card, round.mode)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                    list.innerHTML += html;
                });
            } else {
                list.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px;">No trick history available.</div>';
            }
            
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('history-modal').style.display = 'none';
        }
        
        // Close modal when clicking outside
        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        fetchAnalytics();
    </script>
</body>
</html>
